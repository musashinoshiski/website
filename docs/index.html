    <main>
      <section class="row">
        <div id="hero-carousel" class="carousel slide mb-4" data-bs-ride="carousel">
          <div class="carousel-indicators" id="carousel-indicators-container"></div>
          <div class="carousel-inner" id="carousel-inner-container"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#hero-carousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">&lt;</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#hero-carousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">&gt;</span>
          </button>
        </div>
      </section>
      <div class="row">
        <section class="col-md-6">
          <h3 class="mt-3">最新情報</h3>
          <p id="md-topnews">now loading...</p>
        </section>
        <section class="col-md-6">
          <h4 class="mt-3">今後のスケジュール</h4>
          <iframe src="https://calendar.google.com/calendar/embed?showTitle=0&amp;showNav=0&amp;showDate=0&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0&amp;mode=AGENDA&amp;height=320&amp;wkst=1&amp;bgcolor=%23FFFFFF&amp;src=hus574p8s77r6gklcdu99ppk2c%40group.calendar.google.com&amp;color=%23182C57&amp;ctz=Asia%2FTokyo" style="border-width:0" frameborder="0" scrolling="no" width="100%"></iframe>
        </section>
      </div>

  </div>

  </footer>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/rsms/markdown-wasm@v1.2.0/dist/markdown.js" crossorigin="anonymous"></script>
  <script>
    function parseTopNewsMarkdown(data) {
      $("#md-topnews").html(markdown.parse(data));
    }

    window.onload = async () => {
      await markdown.ready;
      try {
        const response = await fetch("./topnews.md");
        if (!response.ok) {
          throw new Error("failed to read Markdown text");
        }
        const data = await response.text();
        parseTopNewsMarkdown(data);
      } catch (error) {
        console.error("error raised:", error);
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // 1. YAMLファイルをサーバーから取得
        const response = await fetch('/topimages.yml');
        if (!response.ok) throw new Error("YAMLファイルの取得に失敗しました");
        const yamlText = await response.text();

        // 2. js-yamlを使ってテキストをJavaScriptのオブジェクトに変換
        const data = jsyaml.load(yamlText);
        const images = data.images;

        const innerContainer = document.getElementById('carousel-inner-container');
        const indicatorsContainer = document.getElementById('carousel-indicators-container');

        // 3. ループ処理でHTML要素を生成
        images.forEach((image, index) => {
          // インジケーター（下の・）の生成
          const indicator = document.createElement('button');
          indicator.type = 'button';
          indicator.dataset.bsTarget = '#hero-carousel';
          indicator.dataset.bsSlideTo = index;
          indicator.setAttribute('aria-label', `Slide ${index + 1}`);
          
          // 画像スライドの生成
          const item = document.createElement('div');
          item.className = 'carousel-item';
          
          const img = document.createElement('img');
          img.src = image.url;
          img.alt = image.alt;
          img.className = 'd-block w-100 img-fluid'; // Bootstrapクラスでレスポンシブ対応
          
          // 最初の1枚目だけ 'active' クラスを付与して表示させる（Bootstrapの仕様）
          if (index === 0) {
            indicator.classList.add('active');
            indicator.setAttribute('aria-current', 'true');
            item.classList.add('active');
          }

          item.appendChild(img);
          indicatorsContainer.appendChild(indicator);
          innerContainer.appendChild(item);
        });

      } catch (error) {
        console.error('カルーセルの生成中にエラーが発生しました:', error);
        
        // エラー時のフォールバック（通信失敗時などに従来の画像を1枚だけ表示）
        document.getElementById('carousel-inner-container').innerHTML = `
          <div class="carousel-item active">
            <img src="/topimage.jpg" class="d-block w-100 img-fluid" alt="トップ画像">
          </div>
        `;
      }
    });
  </script>
