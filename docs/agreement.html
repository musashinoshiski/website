  <script>
    function parseMarkdown(data) {
      $("#md-agreement").html(markdown.parse(data));
    }

    window.onload = async () => {
      await markdown.ready;
      try {
        const response = await fetch("./agreement.md");        
        if (!response.ok) {
          throw new Error("failed to read Markdown text");
        }        
        const data = await response.text();
        parseMarkdown(data);        
      } catch (error) {
        console.error("error raised:", error);
      }
    };
  </script>
